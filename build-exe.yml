# Build recipe for GitHub Actions. In your repo, create the file .github/workflows/build-exe.yml and paste this whole file into it.
# Builds the Windows installer (GenshinDaily-Setup.exe).
# Run it from the Actions tab: Build Windows app -> Run workflow.
name: Build Windows app

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and package
        run: |
          npm ci
          npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: GenshinDaily-Windows
          path: release/GenshinDaily-Setup.exe
