# Build Windows installer (TravelersGuide-Setup-v<version>.exe)
# Run manually from Actions tab, or triggered by release workflow
name: Build Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for artifact filename (e.g., 1.3.0)'
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: 'Version for artifact filename (e.g., 1.3.0)'
        required: false
        type: string

jobs:
  build:
    name: Build Windows Installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and package
        run: |
          npm ci
          npm run dist:win

      - name: Rename artifact with version
        run: |
          $version = '${{ inputs.version }}'
          if (-not $version) { $version = (Get-Content package.json | ConvertFrom-Json).version }
          # Strip 'v' prefix if present
          if ($version.StartsWith('v')) { $version = $version.Substring(1) }
          $src = "release\TravelersGuide-Setup.exe"
          $dst = "release\TravelersGuide-Setup-v$version.exe"
          Move-Item -Path $src -Destination $dst -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TravelersGuide-Windows
          path: release/TravelersGuide-Setup-v*.exe
          retention-days: 7