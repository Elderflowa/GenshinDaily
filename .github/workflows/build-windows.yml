# Build Windows installer (GenshinDaily-Setup.exe)
# Run manually from Actions tab, or triggered by release workflow
name: Build Windows

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    name: Build Windows Installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and package
        run: |
          npm ci
          npm run dist:win

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GenshinDaily-Windows
          path: release/GenshinDaily-Setup.exe
          retention-days: 7