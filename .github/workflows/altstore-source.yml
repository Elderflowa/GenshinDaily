# Update AltStore source.json and attach to release
name: Update AltStore Source

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest release tag
        id: release
        run: |
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Update source.json with release info
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          VERSION="${TAG#v}"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          cat > source.json << EOF
          {
            "name": "Genshin Daily",
            "apps": [
              {
                "name": "Genshin Daily",
                "bundleIdentifier": "com.genshindaily.app",
                "developerName": "Elderflowa",
                "subtitle": "Daily, weekly & monthly Genshin checklists with sync",
                "iconURL": "https://raw.githubusercontent.com/Elderflowa/GenshinDaily/main/build/icon.png",
                "tintColor": "#9d9bff",
                "version": "$VERSION",
                "versionDate": "$DATE",
                "downloadURL": "https://github.com/Elderflowa/GenshinDaily/releases/download/$TAG/GenshinDaily.ipa",
                "localizedDescription": "A sleek checklist dashboard for Genshin Impact dailies, weeklies, monthlies — with live events, current banners, and PC↔phone sync.\\n\\nFeatures:\\n• Three tabs: Today (dailies + daily bosses), Weekly & Monthly, Events & Banners\\n• Auto-reset at 04:00 server time (Europe / America / Asia)\\n• Timers for Serenitea Pot plants and Crystal Fly traps\\n• Live events & banners from ennead.cc API\\n• Material icons auto-fetched from genshin-db-api\\n• PC ↔ Phone sync via local network\\n• Runs on iOS via AltStore/Sideloadly",
                "size": 0
              }
            ]
          }
          EOF

          cat source.json

      - name: Commit source.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add source.json
          git commit -m "Update AltStore source.json for ${{ steps.release.outputs.tag }}" || echo "No changes to commit"
          git push

      - name: Upload source.json to release
        uses: softprops/action-gh-release@v2
        with:
          files: source.json
          tag_name: ${{ steps.release.outputs.tag }}