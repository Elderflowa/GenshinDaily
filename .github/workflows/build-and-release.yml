# Build Windows installer + iOS .ipa and create a GitHub Release in one workflow
name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        type: string
      title:
        description: 'Release title'
        required: true
        type: string
      notes:
        description: 'Release notes (markdown)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install and package
        run: |
          npm ci
          npm run dist:win
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: GenshinDaily-Windows
          path: release/GenshinDaily-Setup.exe
          retention-days: 1

  build-ipa:
    name: Build iOS IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build the web app
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
        run: |
          npm ci
          npm run build
      - name: Create the iOS project
        run: npx cap add ios
      - name: App icon, dark mode, local network access
        run: |
          ICON="$(find ios/App/App/Assets.xcassets/AppIcon.appiconset -name '*.png' | head -n 1)"
          cp ios-assets/AppIcon-512@2x.png "$ICON"
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIUserInterfaceStyle string Dark" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" -c "Add :NSLocalNetworkUsageDescription string Syncs your checklist with your PC on the home network" "$PLIST"
      - name: Build (unsigned)
        run: |
          xcodebuild archive \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
      - name: Package .ipa
        run: |
          mkdir Payload
          cp -R "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" Payload/
          zip -qr GenshinDaily.ipa Payload
      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: GenshinDaily-ipa
          path: GenshinDaily.ipa
          retention-days: 1

  release:
    name: Create Release
    needs: [build-windows, build-ipa]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: GenshinDaily-Windows
          path: artifacts/windows

      - name: Download iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: GenshinDaily-ipa
          path: artifacts/ios

      - name: Verify artifacts
        run: |
          ls -la artifacts/
          test -f artifacts/windows/GenshinDaily-Setup.exe && echo "✓ Windows installer found"
          test -f artifacts/ios/GenshinDaily.ipa && echo "✓ iOS .ipa found"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.title }}
          body: ${{ github.event.inputs.notes }}
          files: |
            artifacts/windows/GenshinDaily-Setup.exe
            artifacts/ios/GenshinDaily.ipa
          draft: false
          prerelease: false