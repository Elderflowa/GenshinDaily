# Complete release: builds Windows + iOS, creates GitHub Release, updates AltStore source
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        type: string
      title:
        description: 'Release title'
        required: true
        type: string
      notes:
        description: 'Release notes (markdown)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    uses: ./.github/workflows/build-windows.yml
    secrets: inherit

  build-ipa:
    name: Build iOS IPA
    uses: ./.github/workflows/build-ipa.yml
    secrets: inherit

  create-release:
    name: Create Release
    needs: [build-windows, build-ipa]
    runs-on: ubuntu-latest
    outputs:
      ipa-size: ${{ steps.ipa-size.outputs.size }}
      ipa-filename: ${{ steps.ipa-file.outputs.filename }}
      exe-filename: ${{ steps.exe-file.outputs.filename }}
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: TravelersGuide-Windows
          path: artifacts/windows

      - name: Download iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: TravelersGuide-ipa
          path: artifacts/ios

      - name: Verify artifacts
        run: |
          ls -la artifacts/
          EXE_COUNT=$(find artifacts/windows -name 'TravelersGuide-Setup-v*.exe' -type f | wc -l)
          IPA_COUNT=$(find artifacts/ios -name 'TravelersGuide-v*.ipa' -type f | wc -l)
          if [ "$EXE_COUNT" -eq 0 ]; then echo "✗ Windows installer not found"; exit 1; fi
          if [ "$IPA_COUNT" -eq 0 ]; then echo "✗ iOS .ipa not found"; exit 1; fi
          echo "✓ Windows installer found"
          echo "✓ iOS .ipa found"

      - name: Get IPA size
        id: ipa-size
        run: |
          IPA_FILE=$(find artifacts/ios -name 'TravelersGuide-v*.ipa' -type f | head -1)
          SIZE=$(stat -c%s "$IPA_FILE")
          FILENAME=$(basename "$IPA_FILE")
          echo "size=$SIZE" >> $GITHUB_OUTPUT
          echo "filename=$FILENAME" >> $GITHUB_OUTPUT

      - name: Get exe filename
        id: exe-file
        run: |
          EXE_FILE=$(find artifacts/windows -name 'TravelersGuide-Setup-v*.exe' -type f | head -1)
          FILENAME=$(basename "$EXE_FILE")
          echo "filename=$FILENAME" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        id: release
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.title }}
          body: ${{ github.event.inputs.notes }}
          files: |
            artifacts/windows/${{ steps.exe-file.outputs.filename }}
            artifacts/ios/${{ steps.ipa-file.outputs.filename }}
          draft: false
          prerelease: false

  update-altstore:
    name: Update AltStore Source
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update source.json with release info
        run: |
          TAG="${{ github.event.inputs.tag }}"
          VERSION="${TAG#v}"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          SIZE="${{ needs.create-release.outputs.ipa-size || 0 }}"

          # Build description with actual newlines (not \n escapes)
          DESC="Traveler's Guide — A sleek checklist dashboard for Genshin Impact dailies, weeklies, monthlies — with live events, current banners, and PC↔phone sync.

Features:
• Three tabs: Today (dailies + daily bosses), Weekly & Monthly, Events & Banners
• Auto-reset at 04:00 server time (Europe / America / Asia)
• Timers for Serenitea Pot plants and Crystal Fly traps
• Live events & banners from ennead.cc API
• Material icons auto-fetched from genshin-db-api
• PC ↔ Phone sync via local network
• Runs on iOS via AltStore/Sideloadly"

          # Use jq to properly escape JSON strings
          jq -n \
            --arg name "Traveler's Guide" \
            --arg bundleId "com.travelersguide.app" \
            --arg developer "Elderflowa" \
            --arg subtitle "Daily, weekly & monthly Genshin checklists with sync" \
            --arg iconURL "https://raw.githubusercontent.com/Elderflowa/GenshinDaily/main/build/icon.png" \
            --arg tintColor "#9d9bff" \
            --arg version "$VERSION" \
            --arg versionDate "$DATE" \
            --arg downloadURL "https://github.com/Elderflowa/GenshinDaily/releases/download/$TAG/TravelersGuide-v$VERSION.ipa" \
            --arg size "$SIZE" \
            --arg desc "$DESC" \
            '{
              name: $name,
              apps: [{
                name: $name,
                bundleIdentifier: $bundleId,
                developerName: $developer,
                subtitle: $subtitle,
                iconURL: $iconURL,
                tintColor: $tintColor,
                version: $version,
                versionDate: $versionDate,
                downloadURL: $downloadURL,
                localizedDescription: $desc,
                size: ($size | tonumber)
              }]
            }' > source.json

          cat source.json

      - name: Commit source.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f source.json
          git commit -m "Update AltStore source.json for ${{ github.event.inputs.tag }}" || echo "No changes to commit"
          git push

      - name: Attach source.json to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: source.json