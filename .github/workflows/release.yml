# Complete release: builds Windows + iOS, creates GitHub Release, updates AltStore source
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        type: string
      title:
        description: 'Release title'
        required: true
        type: string
      notes:
        description: 'Release notes (markdown)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    uses: ./.github/workflows/build-windows.yml
    secrets: inherit

  build-ipa:
    name: Build iOS IPA
    uses: ./.github/workflows/build-ipa.yml
    secrets: inherit

  create-release:
    name: Create Release
    needs: [build-windows, build-ipa]
    runs-on: ubuntu-latest
    outputs:
      ipa-size: ${{ steps.ipa-size.outputs.size }}
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: TravelersGuide-Windows
          path: artifacts/windows

      - name: Download iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: TravelersGuide-ipa
          path: artifacts/ios

      - name: Verify artifacts
        run: |
          ls -la artifacts/
          test -f artifacts/windows/TravelersGuide-Setup-v*.exe && echo "✓ Windows installer found"
          test -f artifacts/ios/TravelersGuide-v*.ipa && echo "✓ iOS .ipa found"

      - name: Get IPA size
        id: ipa-size
        run: |
          IPA_FILE=$(ls artifacts/ios/TravelersGuide-v*.ipa | head -1)
          SIZE=$(stat -c%s "$IPA_FILE")
          echo "size=$SIZE" >> $GITHUB_OUTPUT
          echo "ipa-file=$IPA_FILE" >> $GITHUB_OUTPUT

      - name: Get exe filename
        id: exe-file
        run: |
          EXE_FILE=$(ls artifacts/windows/TravelersGuide-Setup-v*.exe | head -1)
          echo "exe-file=$EXE_FILE" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        id: release
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.title }}
          body: ${{ github.event.inputs.notes }}
          files: |
            ${{ steps.exe-file.outputs.exe-file }}
            ${{ steps.ipa-file.outputs.ipa-file }}
          draft: false
          prerelease: false

  update-altstore:
    name: Update AltStore Source
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update source.json with release info
        run: |
          TAG="${{ github.event.inputs.tag }}"
          VERSION="${TAG#v}"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          SIZE="${{ needs.create-release.outputs.ipa-size || 0 }}"

          # Use jq to properly escape JSON strings
          jq -n \
            --arg name "Traveler's Guide" \
            --arg bundleId "com.travelersguide.app" \
            --arg developer "Elderflowa" \
            --arg subtitle "Daily, weekly & monthly Genshin checklists with sync" \
            --arg iconURL "https://raw.githubusercontent.com/Elderflowa/GenshinDaily/main/build/icon.png" \
            --arg tintColor "#9d9bff" \
            --arg version "$VERSION" \
            --arg versionDate "$DATE" \
            --arg downloadURL "https://github.com/Elderflowa/GenshinDaily/releases/download/$TAG/TravelersGuide-v$VERSION.ipa" \
            --arg size "$SIZE" \
            --arg desc "Traveler's Guide — A sleek checklist dashboard for Genshin Impact dailies, weeklies, monthlies — with live events, current banners, and PC↔phone sync.\n\nFeatures:\n• Three tabs: Today (dailies + daily bosses), Weekly & Monthly, Events & Banners\n• Auto-reset at 04:00 server time (Europe / America / Asia)\n• Timers for Serenitea Pot plants and Crystal Fly traps\n• Live events & banners from ennead.cc API\n• Material icons auto-fetched from genshin-db-api\n• PC ↔ Phone sync via local network\n• Runs on iOS via AltStore/Sideloadly" \
            '{
              name: $name,
              apps: [{
                name: $name,
                bundleIdentifier: $bundleId,
                developerName: $developer,
                subtitle: $subtitle,
                iconURL: $iconURL,
                tintColor: $tintColor,
                version: $version,
                versionDate: $versionDate,
                downloadURL: $downloadURL,
                localizedDescription: $desc,
                size: ($size | tonumber)
              }]
            }' > source.json

          cat source.json

      - name: Commit source.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f source.json
          git commit -m "Update AltStore source.json for ${{ github.event.inputs.tag }}" || echo "No changes to commit"
          git push

      - name: Attach source.json to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: source.json