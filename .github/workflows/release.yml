# Complete release: builds Windows + iOS, creates GitHub Release, updates AltStore source
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        type: string
      title:
        description: 'Release title'
        required: true
        type: string
      notes:
        description: 'Release notes (markdown)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    uses: ./.github/workflows/build-windows.yml
    secrets: inherit

  build-ipa:
    name: Build iOS IPA
    uses: ./.github/workflows/build-ipa.yml
    secrets: inherit

  create-release:
    name: Create Release
    needs: [build-windows, build-ipa]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: GenshinDaily-Windows
          path: artifacts/windows

      - name: Download iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: GenshinDaily-ipa
          path: artifacts/ios

      - name: Verify artifacts
        run: |
          ls -la artifacts/
          test -f artifacts/windows/GenshinDaily-Setup.exe && echo "✓ Windows installer found"
          test -f artifacts/ios/GenshinDaily.ipa && echo "✓ iOS .ipa found"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        id: release
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.title }}
          body: ${{ github.event.inputs.notes }}
          files: |
            artifacts/windows/GenshinDaily-Setup.exe
            artifacts/ios/GenshinDaily.ipa
          draft: false
          prerelease: false

  update-altstore:
    name: Update AltStore Source
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update source.json with release info
        run: |
          TAG="${{ github.event.inputs.tag }}"
          VERSION="${TAG#v}"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          cat > source.json << EOF
          {
            "name": "Genshin Daily",
            "apps": [
              {
                "name": "Genshin Daily",
                "bundleIdentifier": "com.genshindaily.app",
                "developerName": "Elderflowa",
                "subtitle": "Daily, weekly & monthly Genshin checklists with sync",
                "iconURL": "https://raw.githubusercontent.com/Elderflowa/GenshinDaily/main/build/icon.png",
                "tintColor": "#9d9bff",
                "version": "$VERSION",
                "versionDate": "$DATE",
                "downloadURL": "https://github.com/Elderflowa/GenshinDaily/releases/download/$TAG/GenshinDaily.ipa",
                "localizedDescription": "A sleek checklist dashboard for Genshin Impact dailies, weeklies, monthlies — with live events, current banners, and PC↔phone sync.\\n\\nFeatures:\\n• Three tabs: Today (dailies + daily bosses), Weekly & Monthly, Events & Banners\\n• Auto-reset at 04:00 server time (Europe / America / Asia)\\n• Timers for Serenitea Pot plants and Crystal Fly traps\\n• Live events & banners from ennead.cc API\\n• Material icons auto-fetched from genshin-db-api\\n• PC ↔ Phone sync via local network\\n• Runs on iOS via AltStore/Sideloadly",
                "size": 0
              }
            ]
          }
          EOF

          cat source.json

      - name: Commit source.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add source.json
          git commit -m "Update AltStore source.json for ${{ github.event.inputs.tag }}" || echo "No changes to commit"
          git push

      - name: Attach source.json to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: source.json