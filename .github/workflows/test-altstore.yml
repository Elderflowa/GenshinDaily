# Test AltStore source.json generation and update the real source.json in the repo
# Builds IPA, generates source.json, commits it to main branch
name: Test & Update AltStore Source

on:
  workflow_dispatch:
    inputs:
      test-tag:
        description: 'Test tag (e.g., v1.0.0-test)'
        required: true
        default: 'v1.0.0-test'
        type: string
      commit-message:
        description: 'Commit message'
        required: false
        default: 'Update AltStore source.json (test)'
        type: string

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build iOS IPA
    uses: ./.github/workflows/build-ipa.yml
    secrets: inherit

  generate-and-commit:
    name: Generate & Commit source.json
    needs: build-ipa
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with write access
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: GenshinDaily-ipa
          path: artifacts/ios

      - name: Verify IPA
        run: |
          ls -la artifacts/ios/
          test -f artifacts/ios/GenshinDaily.ipa && echo "✓ IPA found"

      - name: Get IPA size
        id: ipa-size
        run: |
          SIZE=$(stat -c%s artifacts/ios/GenshinDaily.ipa)
          echo "size=$SIZE" >> $GITHUB_OUTPUT
          echo "IPA size: $SIZE bytes ($((SIZE / 1024 / 1024)) MB)"

      - name: Generate source.json
        run: |
          TAG="${{ github.event.inputs.test-tag }}"
          VERSION="${TAG#v}"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          SIZE="${{ steps.ipa-size.outputs.size }}"

          jq -n \
            --arg name "Genshin Daily" \
            --arg bundleId "com.genshindaily.app" \
            --arg developer "Elderflowa" \
            --arg subtitle "Daily, weekly & monthly Genshin checklists with sync" \
            --arg iconURL "https://raw.githubusercontent.com/Elderflowa/GenshinDaily/main/build/icon.png" \
            --arg tintColor "#9d9bff" \
            --arg version "$VERSION" \
            --arg versionDate "$DATE" \
            --arg downloadURL "https://github.com/Elderflowa/GenshinDaily/releases/download/$TAG/GenshinDaily.ipa" \
            --arg size "$SIZE" \
            --arg desc "A sleek checklist dashboard for Genshin Impact dailies, weeklies, monthlies — with live events, current banners, and PC↔phone sync.\n\nFeatures:\n• Three tabs: Today (dailies + daily bosses), Weekly & Monthly, Events & Banners\n• Auto-reset at 04:00 server time (Europe / America / Asia)\n• Timers for Serenitea Pot plants and Crystal Fly traps\n• Live events & banners from ennead.cc API\n• Material icons auto-fetched from genshin-db-api\n• PC ↔ Phone sync via local network\n• Runs on iOS via AltStore/Sideloadly" \
            '{
              name: $name,
              apps: [{
                name: $name,
                bundleIdentifier: $bundleId,
                developerName: $developer,
                subtitle: $subtitle,
                iconURL: $iconURL,
                tintColor: $tintColor,
                version: $version,
                versionDate: $versionDate,
                downloadURL: $downloadURL,
                localizedDescription: $desc,
                size: ($size | tonumber)
              }]
            }' > source.json

          echo "Generated source.json:"
          cat source.json

      - name: Validate source.json
        run: |
          jq . source.json > /dev/null && echo "✓ Valid JSON"
          echo "size type: $(jq -r '.apps[0].size | type' source.json)"
          echo "size value: $(jq -r '.apps[0].size' source.json)"

      - name: Commit and push source.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add source.json
          git commit -m "${{ github.event.inputs.commit-message }} for ${{ github.event.inputs.test-tag }}" || echo "No changes to commit"
          git push

      - name: Upload source.json artifact (for verification)
        uses: actions/upload-artifact@v4
        with:
          name: AltStore-source-test
          path: source.json
          retention-days: 1