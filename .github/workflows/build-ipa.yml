# Build iOS .ipa for sideloading (AltStore, Sideloadly)
# Run manually from Actions tab, or triggered by release workflow
name: Build IPA

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build the web app
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
        run: |
          npm ci
          npm run build

      - name: Create the iOS project
        run: npx cap add ios

      - name: App icon, dark mode, local network access
        run: |
          ICON="$(find ios/App/App/Assets.xcassets/AppIcon.appiconset -name '*.png' | head -n 1)"
          cp ios-assets/AppIcon-512@2x.png "$ICON"
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIUserInterfaceStyle string Dark" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" -c "Add :NSLocalNetworkUsageDescription string Syncs your checklist with your PC on the home network" "$PLIST"

      - name: Build (unsigned)
        run: |
          xcodebuild archive \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Package .ipa
        run: |
          mkdir Payload
          cp -R "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" Payload/
          zip -qr GenshinDaily.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GenshinDaily-ipa
          path: GenshinDaily.ipa
          retention-days: 7